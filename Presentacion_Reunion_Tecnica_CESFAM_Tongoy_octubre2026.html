<title>Indicadores 2026 → 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: deck de diapositivas a pantalla completa; una visible, navegación teclado/botones;
   barra inferior con reloj, contador y notas de moderador ocultables. */
:root{
  --bg:#EEF0F3; --canvas:#FFFFFF; --ink:#1B2229; --ink-soft:#586471; --line:#E3E6EA;
  --pizarra:#22303A; --pizarra-ink:#22303A; --grafito:#3D4852;
  --verde:#1B6B45; --verde-bg:#E7F1EB; --ambar:#8A5A00; --ambar-bg:#F6EDD9; --rojo:#9E2B25; --rojo-bg:#F6E4E2;
  --gris:#6B7580; --gris-bg:#ECEEF0;
  --accent:#22303A;
  --f-display:"Archivo","Archivo Black",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --shadow:0 1px 2px rgba(20,25,30,.06),0 8px 30px rgba(20,25,30,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171C; --canvas:#1B232A; --ink:#ECEFF2; --ink-soft:#A3B2BE; --line:#2B343C;
  --pizarra:#9FB8C7; --pizarra-ink:#CFE0EA; --grafito:#B7C4CE;
  --verde:#4FB084; --verde-bg:#16271F; --ambar:#D7A24A; --ambar-bg:#2A2314; --rojo:#E07A72; --rojo-bg:#2C1917;
  --gris:#9AA6B0; --gris-bg:#222A31;
  --accent:#9FB8C7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12171C; --canvas:#1B232A; --ink:#ECEFF2; --ink-soft:#A3B2BE; --line:#2B343C;
  --pizarra:#9FB8C7; --pizarra-ink:#CFE0EA; --grafito:#B7C4CE;
  --verde:#4FB084; --verde-bg:#16271F; --ambar:#D7A24A; --ambar-bg:#2A2314; --rojo:#E07A72; --rojo-bg:#2C1917;
  --gris:#9AA6B0; --gris-bg:#222A31;
  --accent:#9FB8C7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.4);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}

/* ---- Stage & slides ---- */
#stage{position:fixed;inset:0;bottom:46px;display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  padding:clamp(18px,4vw,56px);max-width:1180px;margin:0 auto;left:0;right:0;overflow-y:auto}
.slide.active{display:flex;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.active{animation:none}}

.eyebrow{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.14em;font-weight:600;
  font-size:clamp(.78rem,1.5vw,1.02rem);color:var(--ink-soft)}
h1{font-family:var(--f-display);font-weight:800;line-height:1.02;letter-spacing:-.01em;
  font-size:clamp(2.1rem,6.2vw,4.2rem);margin:.2em 0 .25em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;line-height:1.05;letter-spacing:-.01em;
  font-size:clamp(1.6rem,4.4vw,2.9rem);margin:.1em 0 .3em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,2.6vw,1.7rem);margin:0 0 .3em}
p{font-size:clamp(1rem,2vw,1.28rem);line-height:1.5;color:var(--ink);margin:.3em 0;max-width:62ch}
.lead{font-size:clamp(1.1rem,2.3vw,1.5rem);color:var(--ink-soft)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ---- Portada ---- */
.cover{gap:.1rem}
.cover .rule{height:5px;width:88px;background:var(--accent);border-radius:3px;margin:.6rem 0 1.1rem}
.cover .meta{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;margin-top:1.1rem;color:var(--ink-soft);
  font-family:var(--f-label);text-transform:uppercase;letter-spacing:.07em;font-size:clamp(.9rem,1.7vw,1.1rem)}
.cover .meta b{color:var(--ink);font-weight:700}

/* ---- Semáforo badge / colors ---- */
.badge{display:inline-flex;align-items:center;gap:.45em;font-family:var(--f-label);text-transform:uppercase;
  letter-spacing:.08em;font-weight:600;font-size:clamp(.85rem,1.6vw,1.05rem);padding:.28em .7em;border-radius:999px;line-height:1}
.dot{width:.62em;height:.62em;border-radius:50%;display:inline-block}
.s-verde{color:var(--verde);background:var(--verde-bg)} .s-verde .dot{background:var(--verde)}
.s-ambar{color:var(--ambar);background:var(--ambar-bg)} .s-ambar .dot{background:var(--ambar)}
.s-rojo{color:var(--rojo);background:var(--rojo-bg)} .s-rojo .dot{background:var(--rojo)}
.s-gris{color:var(--gris);background:var(--gris-bg)} .s-gris .dot{background:var(--gris)}
.bar-verde{border-left:6px solid var(--verde)} .bar-ambar{border-left:6px solid var(--ambar)}
.bar-rojo{border-left:6px solid var(--rojo)} .bar-gris{border-left:6px solid var(--gris)}

/* ---- Indicador (foco) ---- */
.ind{display:flex;flex-direction:column;gap:.1rem}
.ind .code{font-family:var(--f-mono);font-size:clamp(.9rem,1.7vw,1.1rem);color:var(--ink-soft);font-weight:600}
.ind .big{font-family:var(--f-display);font-weight:800;line-height:.92;letter-spacing:-.02em;
  font-size:clamp(4rem,15vw,8.6rem);font-variant-numeric:tabular-nums}
.big.c-verde{color:var(--verde)} .big.c-ambar{color:var(--ambar)} .big.c-rojo{color:var(--rojo)} .big.c-gris{color:var(--gris)}
.ind .unit{font-size:.4em;font-weight:700;color:var(--ink-soft);margin-left:.1em}
.ind-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem}
.detalle{display:flex;flex-wrap:wrap;gap:.5rem 1.6rem;font-family:var(--f-label);text-transform:uppercase;
  letter-spacing:.06em;font-size:clamp(.92rem,1.8vw,1.18rem);color:var(--ink-soft);margin-top:.2rem}
.detalle b{color:var(--ink);font-weight:700}
.rem{font-family:var(--f-mono);font-size:clamp(.82rem,1.5vw,1rem);color:var(--ink-soft);background:var(--gris-bg);
  border-radius:8px;padding:.4em .7em;display:inline-block;margin-top:.5rem}
.nota{margin-top:1rem;padding:.75rem 1rem;background:var(--canvas);border-radius:12px;box-shadow:var(--shadow);
  font-size:clamp(1rem,2vw,1.3rem);line-height:1.45}
.nota .k{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  color:var(--ink-soft);font-size:.72em;display:block;margin-bottom:.15em}

/* ---- Tile grid (fortalezas / ronda rápida) ---- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.7rem,1.8vw,1.1rem);margin-top:.8rem}
@media(min-width:820px){.tiles.c4{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--canvas);border-radius:14px;box-shadow:var(--shadow);padding:clamp(.8rem,2vw,1.2rem);
  display:flex;flex-direction:column;gap:.25rem;min-width:0}
.tile .code{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-soft);font-weight:600}
.tile .nm{font-family:var(--f-label);font-size:clamp(1rem,2vw,1.25rem);font-weight:600;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4.4vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums}
.v.c-verde{color:var(--verde)} .v.c-ambar{color:var(--ambar)} .v.c-rojo{color:var(--rojo)} .v.c-gris{color:var(--gris)}
.tile .sub{font-size:.9rem;color:var(--ink-soft)}

/* ---- Paradoja (dos columnas) ---- */
.para{display:grid;grid-template-columns:1fr;gap:clamp(.8rem,2vw,1.3rem);margin-top:.6rem}
@media(min-width:760px){.para{grid-template-columns:1fr 1fr}}
.col{background:var(--canvas);border-radius:16px;box-shadow:var(--shadow);padding:clamp(1rem,2.4vw,1.5rem)}
.col h3{font-size:clamp(1.1rem,2.4vw,1.5rem)}
.col ul{margin:.4rem 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:.4rem}
.col li{display:flex;gap:.5rem;align-items:baseline;font-size:clamp(.95rem,1.9vw,1.18rem);line-height:1.35}
.col li .m{font-family:var(--f-mono);font-weight:700;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.col.good li .m{color:var(--verde)} .col.gap li .m{color:var(--rojo)}
.tesis{margin-top:1rem;font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,2.6vw,1.7rem);
  line-height:1.2;text-wrap:balance}
.tesis em{font-style:normal;color:var(--rojo)}

/* ---- Tablero ---- */
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.7rem,2vw,1.1rem);margin:.8rem 0}
@media(min-width:720px){.score{grid-template-columns:repeat(4,1fr)}}
.sc{border-radius:16px;padding:clamp(1rem,2.4vw,1.5rem);text-align:center;box-shadow:var(--shadow)}
.sc .n{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,7vw,4.2rem);line-height:1}
.sc .l{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:clamp(.9rem,1.7vw,1.1rem);margin-top:.2rem}
.sc.v{background:var(--verde-bg);color:var(--verde)} .sc.a{background:var(--ambar-bg);color:var(--ambar)}
.sc.r{background:var(--rojo-bg);color:var(--rojo)} .sc.g{background:var(--gris-bg);color:var(--gris)}

/* ---- Divisor de bloque ---- */
.divisor{background:var(--accent);margin:calc(-1*clamp(18px,4vw,56px));padding:clamp(28px,6vw,72px);
  color:#fff;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:.4rem}
:root[data-theme="dark"] .divisor,:root:not([data-theme="light"]) .divisor{color:#0E1419}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .divisor{color:#fff}}
.divisor .eyebrow{color:rgba(255,255,255,.72)}
:root[data-theme="dark"] .divisor .eyebrow{color:rgba(14,20,25,.66)}
.divisor h1{color:inherit;font-size:clamp(2.2rem,6.5vw,4rem)}
.divisor .blk-no{font-family:var(--f-mono);font-weight:700;font-size:clamp(1rem,2.2vw,1.3rem);opacity:.8}
.chiprow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;
  padding:.35em .9em;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  font-size:clamp(.85rem,1.6vw,1.02rem)}
:root[data-theme="dark"] .chip{background:rgba(14,20,25,.12);border-color:rgba(14,20,25,.2)}
.tecnica{margin-top:1.1rem;font-size:clamp(1.02rem,2.1vw,1.35rem);line-height:1.4;max-width:60ch}
.tecnica b{font-weight:800}

/* ---- Pregunta 2027 ---- */
.preg{display:flex;flex-direction:column;justify-content:center;gap:.6rem}
.preg .tag{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--rojo)}
.preg q, .preg .q{display:block;font-family:var(--f-display);font-weight:800;line-height:1.08;letter-spacing:-.01em;
  font-size:clamp(1.8rem,4.8vw,3.2rem);text-wrap:balance}
.preg .q:before{content:"“"} .preg .q:after{content:"”"}
.preg .subq{margin-top:.6rem;display:flex;flex-direction:column;gap:.35rem}
.preg .subq div{font-size:clamp(1rem,2vw,1.3rem);color:var(--ink-soft);padding-left:1.1em;position:relative}
.preg .subq div:before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:700}

/* ---- Acción ---- */
.accion{display:flex;flex-direction:column;gap:.8rem}
.accion .frame{background:var(--canvas);border-radius:16px;box-shadow:var(--shadow);padding:clamp(1rem,2.6vw,1.6rem);
  border-left:6px solid var(--accent)}
.accion .row{display:grid;grid-template-columns:1fr;gap:.5rem 1rem;margin-top:.5rem}
@media(min-width:680px){.accion .row{grid-template-columns:2fr 1fr 1fr}}
.accion .fld{border-bottom:2px dashed var(--line);padding:.4em 0 .5em}
.accion .fld .k{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-soft);font-size:.8rem}
.accion .fld .ph{color:var(--ink-soft);font-style:italic;font-size:1.02rem}

/* ---- Priorización ---- */
.prio{display:grid;grid-template-columns:1fr;gap:.7rem;margin-top:.6rem}
@media(min-width:720px){.prio{grid-template-columns:1fr 1fr 1fr}}
.pcard{background:var(--canvas);border-radius:14px;box-shadow:var(--shadow);padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.pcard .code{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-soft);font-weight:600}
.pcard .nm{font-family:var(--f-label);text-transform:uppercase;font-weight:600;font-size:clamp(1rem,2vw,1.25rem);line-height:1.1}
.pcard .v{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--rojo);line-height:1}
.votos{margin-top:.4rem;font-size:.88rem;color:var(--ink-soft);font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em}
.votos .dots{letter-spacing:.2em}

/* ---- Horizonte 2027 ---- */
.hz{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:.5rem}
@media(min-width:760px){.hz{grid-template-columns:1fr 1fr}}
.hz .box{background:var(--canvas);border-radius:16px;box-shadow:var(--shadow);padding:1.2rem}
.hz .box.keep{border-top:5px solid var(--verde)} .hz .box.go{border-top:5px solid var(--rojo)}
.hz ul{margin:.4rem 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:.3rem}
.hz li{font-size:clamp(.98rem,1.9vw,1.22rem);line-height:1.35}

ul.plain{list-style:none;padding:0;margin:.4rem 0 0;display:flex;flex-direction:column;gap:.55rem}
ul.plain li{display:flex;gap:.6rem;align-items:baseline;font-size:clamp(1rem,2vw,1.3rem);line-height:1.4}
ul.plain li .ic{font-family:var(--f-display);font-weight:800;color:var(--accent);min-width:1.4em}

.fuente{position:absolute;bottom:clamp(8px,1.6vw,16px);right:clamp(14px,2vw,28px);
  font-family:var(--f-mono);font-size:.74rem;color:var(--ink-soft);opacity:.7}

/* ---- Toolbar ---- */
#bar{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:.4rem;
  padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);background:var(--canvas);border-top:1px solid var(--line);z-index:30}
#bar button{font:inherit;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.04em;font-weight:600;
  background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.3em .6em;cursor:pointer;font-size:.86rem}
#bar button:hover{background:var(--bg)}
#bar button:focus-visible,.slide a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar .spacer{flex:1}
#count{font-family:var(--f-mono);font-size:.9rem;color:var(--ink-soft);min-width:4.4em;text-align:center}
#clock{font-family:var(--f-mono);font-weight:700;font-size:.98rem;font-variant-numeric:tabular-nums;
  padding:.2em .5em;border-radius:7px;background:var(--bg)}
#clock.run{color:var(--verde)}
#prog{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:40;transition:width .25s ease}
.barlabel{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;color:var(--ink-soft)}
@media(max-width:600px){.hide-sm{display:none}}

/* ---- Notas de moderador ---- */
#notes{position:fixed;left:0;right:0;bottom:46px;max-height:42vh;overflow-y:auto;background:var(--pizarra);
  color:#EAF1F6;padding:1rem 1.2rem calc(1rem + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
:root[data-theme="dark"] #notes,:root:not([data-theme="light"]) #notes{background:#0C1116}
#notes .nh{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.12em;font-weight:700;
  font-size:.78rem;color:#8FB0C4;margin-bottom:.4rem;display:flex;gap:.6rem;align-items:center}
#notes .nh .t{background:rgba(255,255,255,.12);border-radius:6px;padding:.15em .55em;font-family:var(--f-mono)}
#notes .body{font-size:clamp(.95rem,1.8vw,1.12rem);line-height:1.5;max-width:92ch}
#notes .body b{color:#fff}
#notes .body .tech{display:inline-block;background:#1B6B45;color:#fff;border-radius:6px;padding:.1em .5em;
  font-family:var(--f-label);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:.82em;margin-right:.4em}

/* ---- Help overlay ---- */
#help{position:fixed;inset:0;background:rgba(10,14,18,.72);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#help.on{display:flex}
#help .card{background:var(--canvas);color:var(--ink);border-radius:16px;padding:1.4rem 1.6rem;max-width:460px;box-shadow:var(--shadow)}
#help h3{margin-top:0}
#help table{width:100%;border-collapse:collapse;font-size:1rem}
#help td{padding:.3em 0;border-bottom:1px solid var(--line)}
#help kbd{font-family:var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.1em .5em;font-size:.9em}
#help .close{margin-top:1rem}
</style>

<script>
/* ================= DATOS DE INDICADORES — corte octubre 2026 (consolidado DEIS 105321 + 105405) ================= */
const IND = {
  // --- Cardiometabólico ---

/* ================= HELPERS DE RENDER ================= */
const colorClass=e=>({verde:"c-verde",ambar:"c-ambar",rojo:"c-rojo",gris:"c-gris"}[e]);
const barClass=e=>({verde:"bar-verde",ambar:"bar-ambar",rojo:"bar-rojo",gris:"bar-gris"}[e]);
const sClass=e=>({verde:"s-verde",ambar:"s-ambar",rojo:"s-rojo",gris:"s-gris"}[e]);
const pctTxt=p=>p===null?"s/d":String(p).replace(".",",");

function badge(e){return `<span class="badge ${sClass(e)}"><span class="dot"></span>${estName[e]}</span>`;}

function indFull(key,bloque){
  const d=IND[key];
  return {time:"",notes:"",html:`<div class="slide-pad ind ${barClass(d.est)}" style="border-left-width:8px;padding-left:clamp(14px,3vw,34px)">
     <div class="eyebrow">${bloque} · ${d.code}</div>
     <div class="ind-head">
       <h2 style="margin:.15em 0 0">${d.nm}</h2>
       ${badge(d.est)}
     </div>
     <div class="big ${colorClass(d.est)}">${pctTxt(d.pct)}${d.pct!==null?'<span class="unit">% al corte</span>':''}</div>
     <div class="detalle">${d.det.split(" · ").map(x=>{const[a,b]=x.split(/ (?=\d|Meta|Sin)/);return `<span>${x}</span>`;}).join("")}</div>
     ${d.rem?`<div class="rem">REM · ${d.rem}</div>`:""}
     ${d.nota?`<div class="nota"><span class="k">Lectura salubrista</span>${d.nota}</div>`:""}
     ${d.remove?`<div class="rem" style="background:var(--rojo-bg);color:var(--rojo)">⚑ Meta que se retira en 2027</div>`:""}
  </div>`};
}
function tileSlide(eyebrow,title,keys){
  const tiles=keys.map(k=>{const d=IND[k];return `<div class="tile ${barClass(d.est)}">
     <span class="code">${d.code}</span>
     <span class="nm">${d.nm}</span>
     <span class="v ${colorClass(d.est)}">${pctTxt(d.pct)}${d.pct!==null?'<span style="font-size:.5em;color:var(--ink-soft)">%</span>':''}</span>
     <span class="sub">${d.det}</span>
   </div>`}).join("");
  return `<div class="slide-pad"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>
     <div class="tiles c4">${tiles}</div></div>`;
}

/* ================= MONTAJE ================= */
const stage=document.getElementById("stage");
S.forEach((s,i)=>{
  const el=document.createElement("section");
  el.className="slide";el.setAttribute("role","group");el.setAttribute("aria-label",`Diapositiva ${i+1} de ${S.length}`);
  el.innerHTML=(/^\s*<div class="(slide-pad|divisor)/.test(s.html)?s.html:`<div class="slide-pad">${s.html}</div>`)
     + `<span class="fuente">REM Serie A · oct 2026 · 105321+105405</span>`;
  stage.appendChild(el);
});
const slides=[...document.querySelectorAll(".slide")];
let cur=0;
const prog=document.getElementById("prog"),count=document.getElementById("count"),
  noteBody=document.getElementById("note-body"),noteTime=document.getElementById("note-time"),notesEl=document.getElementById("notes");
function render(){
  slides.forEach((s,i)=>s.classList.toggle("active",i===cur));
  count.textContent=`${cur+1} / ${S.length}`;
  prog.style.width=((cur)/(S.length-1)*100)+"%";
  noteBody.innerHTML=S[cur].notes||"<i style='opacity:.6'>— sin notas para esta diapositiva —</i>";
  noteTime.textContent=S[cur].time?("▶ "+S[cur].time):"—";
  const a=slides[cur];a.scrollTop=0;a.focus&&a.setAttribute("tabindex","-1");
}
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);

/* Notas */
function toggleNotes(){notesEl.hidden=!notesEl.hidden;}
document.getElementById("btn-notes").onclick=toggleNotes;

/* Reloj de reunión */
let secs=0,timer=null;const clock=document.getElementById("clock");
function fmt(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
function tick(){secs++;clock.textContent=fmt(secs);}
function toggleTimer(){if(timer){clearInterval(timer);timer=null;clock.classList.remove("run");}
  else{timer=setInterval(tick,1000);clock.classList.add("run");}}
function resetTimer(){clearInterval(timer);timer=null;secs=0;clock.textContent="00:00";clock.classList.remove("run");}
clock.onclick=toggleTimer;

/* Pantalla completa */
function toggleFull(){const d=document.documentElement;
  if(!document.fullscreenElement){(d.requestFullscreen||(()=>{})).call(d).catch(()=>{});}
  else{(document.exitFullscreen||(()=>{})).call(document).catch(()=>{});}}
document.getElementById("btn-full").onclick=toggleFull;

/* Ayuda */
const help=document.getElementById("help");
document.getElementById("btn-help").onclick=()=>help.classList.add("on");
document.getElementById("help-close").onclick=()=>help.classList.remove("on");
help.onclick=e=>{if(e.target===help)help.classList.remove("on");};

/* Teclado */
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(cur+1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1);}
  else if(e.key==="Home"){go(0);} else if(e.key==="End"){go(S.length-1);}
  else if(e.key==="n"||e.key==="N"){toggleNotes();}
  else if(e.key==="t"||e.key==="T"){toggleTimer();}
  else if(e.key==="r"||e.key==="R"){resetTimer();}
  else if(e.key==="f"||e.key==="F"){toggleFull();}
  else if(e.key==="?"||e.key==="h"||e.key==="H"){help.classList.toggle("on");}
  else if(e.key==="Escape"){help.classList.remove("on");}
});
/* Hash para recuperar posición */
function fromHash(){const m=/^#s(\d+)$/.exec(location.hash);if(m){const n=+m[1]-1;if(n>=0&&n<S.length)cur=n;}}
fromHash();addEventListener("hashchange",()=>{fromHash();render();});
const _go=go;go=function(n){_go(n);try{history.replaceState(null,"","#s"+(cur+1));}catch(e){}};
render();
</script>
